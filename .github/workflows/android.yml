name: Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project root
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "DevamTakipAndroid/settings.gradle.kts" ] || [ -f "DevamTakipAndroid/settings.gradle" ]; then
            PROJECT_DIR="DevamTakipAndroid"
          else
            SETTINGS_FILE="$(find . -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "HATA: settings.gradle(.kts) bulunamadı. Android projesinin tüm dosyalarını depoya yükleyin."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android projesi: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google has withdrawn the legacy SDK package named "tools".
          # Explicitly request platform-tools to avoid the obsolete default in older action versions.
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show build tools
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devam-takip-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
